name = "banglachoti24-new-blog"
main = "worker/index.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[cache]
enabled = true

[secrets]
required = ["ADMIN_PASSWORD", "ADMIN_SESSION_SECRET"]

# D1 and R2 resource bindings are provisioned by the deployment/setup scripts.
# Keep production resource IDs out of source control when the repo is first configured.

[vars]
SITE_URL = "https://new.banglachoti24.com"

[[routes]]
pattern = "new.banglachoti24.com"
custom_domain = true
