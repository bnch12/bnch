name: Deploy new blog CMS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: new-blog-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      D1_DATABASE_NAME: banglachoti24-new-blog
      R2_BUCKET_NAME: banglachoti24-new-blog-media
      SITE_URL: https://new.banglachoti24.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Ensure D1 and R2 resources exist and configure bindings
        run: node scripts/ensure-cloudflare-resources.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply banglachoti24-new-blog --remote

      - name: Set production secrets
        shell: bash
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler secret put ADMIN_SESSION_SECRET

      - name: Build and deploy vinext app
        run: npx @vinext/cloudflare deploy
